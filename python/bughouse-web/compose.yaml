# Run from this directory: docker compose up --build -d
services:
  bughouse:
    build:
      context: ../..
      dockerfile: python/bughouse-web/Dockerfile
    platform: linux/amd64
    # Linux VPS: keep nginx's loopback connection identity, without trusting a
    # container bridge or arbitrary public X-Forwarded-For headers.
    network_mode: host
    command: ["uvicorn", "server:app", "--app-dir", "/app/python/bughouse-web", "--host", "127.0.0.1", "--port", "8080", "--workers", "1", "--limit-concurrency", "32", "--timeout-keep-alive", "5", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    cpus: 2
    mem_limit: 2g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      BUGHOUSE_ORIGINS: "https://chessautoprep.com,https://andrewbernal.com"
