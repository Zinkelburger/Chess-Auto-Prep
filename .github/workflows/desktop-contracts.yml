name: V2 desktop contracts

on:
  workflow_call:
    inputs:
      targets:
        type: string
        default: '[{"os":"windows-2022","device":"windows"},{"os":"windows-2025","device":"windows"},{"os":"macos-26","device":"macos"},{"os":"ubuntu-22.04","device":"linux"}]'

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev pkg-config xvfb
      - name: Disposable Windows file associations
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path HKCU:\Software\ChessAutoPrep -Force | Out-Null
          New-ItemProperty -Path HKCU:\Software\ChessAutoPrep -Name FileAssociationChoice -Value no -PropertyType String -Force | Out-Null
      - run: flutter pub get
      - name: Native v2 document and application contracts
        run: |
          set -o pipefail
          flutter test --reporter expanded \
            test/storage/document_file_io_test.dart \
            test/storage/native_call_runner_test.dart \
            test/storage/platform_documents_test.dart \
            test/storage/pgn_file_store_test.dart \
            test/storage/compound_completed_retry_test.dart \
            test/storage/snapshot_lifetime_test.dart \
            test/storage/training_source_test.dart \
            test/storage/training_retry_test.dart \
            test/storage/relocation_sync_test.dart \
            test/storage/file_lock_test.dart \
            test/storage/disk_usage_test.dart \
            test/storage/master_games_process_test.dart \
            test/storage/master_games_import_test.dart \
            test/features/database_storage_test.dart \
            test/ui/name_dialog_test.dart \
            test/app/native_file_requests_test.dart \
            test/app/app_exit_test.dart \
            test/net/lichess_login_test.dart 2>&1 | tee desktop-contracts.log
      - name: Fetch this host's Stockfish
        run: python tools/fetch_assets.py --only stockfish
      - name: Built v2 app, native engines and login sockets
        run: |
          set -o pipefail
          if [[ '${{ runner.os }}' == Linux ]]; then
            xvfb-run -a flutter test integration_test/v2_desktop_test.dart -d linux --reporter expanded 2>&1 | tee desktop-integration.log
          else
            flutter test integration_test/v2_desktop_test.dart -d '${{ matrix.target.device }}' --reporter expanded 2>&1 | tee desktop-integration.log
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: desktop-contracts-${{ matrix.target.os }}
          path: desktop-*.log
      - name: Build the macOS release with its release entitlements
        if: runner.os == 'macOS'
        run: flutter build macos --release -t lib/main.dart
      - name: Check the sandboxed macOS release executable
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app)
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          codesign --verify --deep --strict "$APP"
          python tools/test_desktop_bundle.py "$APP/Contents/MacOS/$EXEC" --report desktop-release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && runner.os == 'macOS'
        with:
          name: desktop-release-${{ matrix.target.os }}
          path: desktop-release.json
