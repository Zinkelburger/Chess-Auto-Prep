# Runs the local quality gates, Linux boot and native Windows update contracts.

name: CI

# Called only by release.yml when a v* release tag is pushed.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release tag matches the embedded application version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import os
          import re
          from pathlib import Path
          version = re.search(r'^version:\s*(\S+)', Path('pubspec.yaml').read_text(), re.M).group(1)
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match pubspec.yaml for update comparisons'
          PYCODE

      # Pinned so the formatter can't drift between stable releases and
      # start flagging files that are clean locally. Bump deliberately,
      # re-running `dart format` in the same commit if output changes.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev pkg-config

      - run: flutter pub get

      - name: Check Dart formatting
        run: dart format --set-exit-if-changed lib test integration_test

      # Errors and warnings fail the job; info-level hints (e.g. avoid_print) do not.
      - name: Analyze (lib + test)
        run: flutter analyze lib test integration_test --no-fatal-infos

      - name: Run tests with coverage
        run: |
          flutter test --coverage
          scripts/check_coverage.sh coverage/lcov.info

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check agent rule references
        run: python3 scripts/sync_agent_rules.py --check

      - run: python -m pip install -r tools/mcp/requirements.txt

      - name: Run deterministic offline tool tests
        run: scripts/test_tools.sh

  windows-update-contracts:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Run early alongside the other gates, before expensive release builds.
      # Separate steps prevent a later command masking an earlier failure in pwsh.
      - name: Test native Windows update helper
        env:
          APP_UPDATE_TEST_ARTIFACTS: ${{ runner.temp }}/updater-diagnostics
        run: python tools/test_app_updates.py -v

      - name: Preserve Windows updater diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-updater-diagnostics
          path: ${{ runner.temp }}/updater-diagnostics
          if-no-files-found: warn

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Test Windows updater and storage upgrade contracts
        run: flutter test test/features/updates test/services/storage/upgrade_contract_test.dart

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install Linux desktop and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev pkg-config xvfb

      - run: flutter pub get

      - name: Run integration tests (headless)
        timeout-minutes: 5
        run: xvfb-run flutter test integration_test/app_test.dart -d linux
