# Runs the local quality gates, the v2 desktop contracts (which boot the built
# app on Linux, Windows and macOS) and native Windows update contracts.

name: CI

# Called by release.yml for tagged releases.
on:
  workflow_call:

jobs:
  v2-desktop:
    uses: ./.github/workflows/desktop-contracts.yml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned so the formatter can't drift between stable releases and
      # start flagging files that are clean locally. Bump deliberately,
      # re-running `dart format` in the same commit if output changes.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev pkg-config

      - name: Validate the committed release candidate
        run: python3 scripts/dart_checks.py preflight --flutter flutter

      - name: Preserve quality gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flutter-quality-results
          path: build/quality-gates/
          if-no-files-found: warn

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Check agent rule references
        run: python3 scripts/sync_agent_rules.py --check

      - run: python -m pip install -r tools/mcp/requirements.txt

      - name: Run deterministic offline tool tests
        run: scripts/test_tools.sh

  windows-update-contracts:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # Run early alongside the other gates, before expensive release builds.
      # Separate steps prevent a later command masking an earlier failure in pwsh.
      - name: Test native Windows update helper
        env:
          APP_UPDATE_TEST_ARTIFACTS: ${{ runner.temp }}/updater-diagnostics
        run: python tools/test_app_updates.py -v

      - name: Preserve Windows updater diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-updater-diagnostics
          path: ${{ runner.temp }}/updater-diagnostics
          if-no-files-found: warn

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Test Windows updater and storage upgrade contracts
        run: >-
          flutter test
          test/net/github_releases_test.dart
          test/features/settings/update_offer_test.dart
          test/features/settings/app_updates_test.dart
          test/features/settings/update_prompt_test.dart
          test/storage/update_files_test.dart
          test/storage/update_install_test.dart
          test/storage/game_store_test.dart
          test/storage/master_games_import_test.dart
