# Does the bughouse engine actually run on the platforms we ship it to?
#
# The engine is HypeBeast, a Fairy-Stockfish fork: one release binary per
# platform plus the bughouse NNUE, fetched at release time and never built
# here, while the app's own tests drive a fake. Three things are checked:
#
#   deps    A static audit of the shipped binary's own headers: static on
#           Linux, only Windows' own DLLs on Windows. Every hosted image has
#           the Visual C++ redistributable installed, so a runner cannot
#           pretend to be a clean machine — but it can read what the binary
#           asks for and insist it is part of the OS.
#
#   run     A real launch: extract the way the app does, load the net,
#           handshake, run a coordinated two-board search and require a joint
#           move back.
#
#   client  The same two files through the app's own Dart client, which is
#           where the two-board dialect, the joint-move parsing and the
#           handshake timeout live.
#
# Linux/Windows app-client checks run here. Both macOS architectures run the
# dependency audit and real search in their release build jobs.

name: Bughouse engine

# Called by release.yml for tagged releases.
on:
  workflow_call:

jobs:
  engine:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # Pinned to match ci.yml and release.yml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache bughouse engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/assets.lock.json') }}-${{ matrix.os }}

      - name: Fetch the engine for this platform
        run: |
          python tools/fetch_assets.py --only bughouse
          python tools/fetch_assets.py --check --only bughouse

      # Static, and the only check here that a hosted runner cannot fake.
      - name: Audit what the binary needs
        run: python tools/test_bughouse_engine.py deps

      # Live. Extracts the way HypeBeastInstall does — same names, same size
      # and SHA-256 check against manifest.json — then loads the net and searches.
      # The directory has a space in its name on purpose. The app extracts the
      # engine under "…\Chess Auto Prep\bughouse", so every path it hands the
      # engine has one, and a Windows command line splits on spaces unless the
      # launcher quotes them. A diagnosis on a user's machine once produced
      # "Unknown UCI option: Auto" for exactly that reason. Nothing in this
      # repo has a space in its path, so without this the runners never ask.
      - name: Load the network and search
        timeout-minutes: 10
        run: python tools/test_bughouse_engine.py run --install-to "engine under test"

      - run: flutter pub get

      - name: Drive the engine through the app's client
        timeout-minutes: 10
        env:
          HYPEBEAST_BIN: ${{ matrix.os == 'windows-2022' && 'engine under test/hypebeast-windows.exe' || 'engine under test/hypebeast-linux' }}
          HYPEBEAST_NET: engine under test/bughouse-cd8cceab93fe.nnue
        run: >-
          flutter test test/engines/hypebeast_real_test.dart
          test/engines/hypebeast_engine_test.dart
          test/engines/hypebeast_install_test.dart
          test/features/bughouse

      # Unlike the Python extraction/client checks, this runs inside a built
      # Flutter desktop app. It proves rootBundle discovery, first extraction,
      # Unicode profile paths and corruption recovery.
      - name: Fetch bundled Stockfish for the desktop boot test
        if: runner.os == 'Windows'
        run: python tools/fetch_assets.py --only stockfish-windows

      # This disposable runner has no person to answer the native .pgn offer.
      # Decline that optional association as Setup can; leave all engine files
      # and the first-use test's application profile absent.
      - name: Decline file associations in the disposable test account
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path HKCU:\Software\ChessAutoPrep -Force | Out-Null
          New-ItemProperty -Path HKCU:\Software\ChessAutoPrep `
            -Name FileAssociationChoice -Value no -PropertyType String -Force | Out-Null

      - name: Boot the Windows app and test first-use bughouse installation
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: >-
          flutter test integration_test/bughouse_first_run_test.dart -d windows
