name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Stockfish is gitignored and fetched per job (host/arch only) so git clones
# stay small. Each artifact still bundles that platform's engine via
# pubspec.yaml → assets/executables/. macOS is two downloads, not a universal
# binary: Apple Silicon and Intel each get a native Flutter build plus the
# matching Stockfish in the same stockfish-macos.gz slot.

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang libgtk-3-dev pkg-config git g++ make \
            libsnappy-dev liblz4-dev libzstd-dev libbz2-dev \
            libboost-fiber-dev libboost-context-dev libtbb-dev libjemalloc-dev zlib1g-dev

      - name: Cache TerarkDB + cdbdirect build
        uses: actions/cache@v4
        id: cdbdirect-cache
        with:
          path: packages/cdbdirect_flutter_libs/.build/deps
          key: cdbdirect-terarkdb-v1-${{ hashFiles('packages/cdbdirect_flutter_libs/scripts/build_native.sh', 'packages/cdbdirect_flutter_libs/src/cdbdirect_capi.cpp') }}
          restore-keys: |
            cdbdirect-terarkdb-v1-

      - name: Build bundled libcdbdirect.so
        run: |
          ./packages/cdbdirect_flutter_libs/scripts/build_native.sh --target linux-x64
          test -f packages/cdbdirect_flutter_libs/native/linux-x64/libcdbdirect.so

      - name: Cache Stockfish
        uses: actions/cache@v4
        with:
          path: assets/executables
          key: stockfish-${{ hashFiles('tools/assets.lock.json') }}-linux

      - name: Fetch Stockfish (Linux)
        run: |
          python3 tools/fetch_assets.py --only stockfish-linux
          python3 tools/fetch_assets.py --check --only stockfish-linux

      - name: Cache bughouse engine
        uses: actions/cache@v4
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/bughouse.lock.json') }}-linux

      # --check is not belt-and-braces here: a *missing* asset directory is
      # only a warning to `flutter build`, so a failed fetch would otherwise
      # sail through and ship an installer whose Bughouse Lab is simply absent.
      - name: Fetch bughouse engine (Linux)
        run: |
          python3 tools/fetch_bughouse.py --only bughouse-linux
          python3 tools/fetch_bughouse.py --check --only bughouse-linux

      - name: Build Linux release
        run: flutter build linux --release

      # libcdbdirect.so dynamically links libraries end users won't have
      # (boost_fiber, TBB, jemalloc, snappy, ...). It is linked with an
      # $ORIGIN rpath, so copying them next to it makes them resolve both in
      # the zip and inside the Flatpak.
      - name: Bundle libcdbdirect runtime dependencies
        run: |
          BUNDLE_LIB=build/linux/x64/release/bundle/lib
          test -f "$BUNDLE_LIB/libcdbdirect.so"
          for dep in $(ldd "$BUNDLE_LIB/libcdbdirect.so" | awk '$3 ~ /^\// {print $3}'); do
            case "$(basename "$dep")" in
              libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|ld-linux*) continue ;;
              libgcc_s*|libstdc++*|libgomp*|libatomic*) continue ;;
            esac
            cp -vn "$dep" "$BUNDLE_LIB/"
          done

      - name: Zip bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../chess-auto-prep-${{ github.ref_name }}-linux.zip .

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/deb/build_deb.sh "$VERSION" build/linux/x64/release/bundle .
          mv "chess-auto-prep-$VERSION-linux-amd64.deb" \
             "chess-auto-prep-${{ github.ref_name }}-linux-amd64.deb"

      - name: Install flatpak-builder
        run: sudo apt-get install -y flatpak flatpak-builder

      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=flatpak-repo flatpak-build \
            packaging/flatpak/com.example.chess_auto_prep.yml
          flatpak build-bundle flatpak-repo \
            chess-auto-prep-${{ github.ref_name }}-linux.flatpak com.example.chess_auto_prep

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            chess-auto-prep-${{ github.ref_name }}-linux.zip
            chess-auto-prep-${{ github.ref_name }}-linux.flatpak
            chess-auto-prep-${{ github.ref_name }}-linux-amd64.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Stockfish
        uses: actions/cache@v4
        with:
          path: assets/executables
          key: stockfish-${{ hashFiles('tools/assets.lock.json') }}-windows

      - name: Fetch Stockfish (Windows)
        run: |
          python tools/fetch_assets.py --only stockfish-windows
          python tools/fetch_assets.py --check --only stockfish-windows

      - name: Cache bughouse engine
        uses: actions/cache@v4
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/bughouse.lock.json') }}-windows

      - name: Fetch bughouse engine (Windows)
        run: |
          python tools/fetch_bughouse.py --only bughouse-windows
          python tools/fetch_bughouse.py --check --only bughouse-windows

      - name: Build Windows release
        run: flutter build windows --release

      # The four DLLs windows/CMakeLists.txt deploys app-locally. Asserted
      # rather than assumed for the same reason the asset fetches are: the app
      # imports these, so a bundle without them does not start at all, and
      # nothing earlier in this job would have said so. Whether CMake's redist
      # list carries MSVCP140_1.dll varies by toolchain, and onnxruntime.dll
      # needs it, so it is named here explicitly.
      - name: Verify the VC++ runtime is bundled
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          $missing = @()
          foreach ($dll in @('MSVCP140.dll','MSVCP140_1.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')) {
            if (-not (Test-Path (Join-Path $bundle $dll))) { $missing += $dll }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Bundle is missing: $($missing -join ', ')"
            Get-ChildItem $bundle -Filter *.dll | Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host "VC++ runtime bundled:"
          Get-ChildItem $bundle -Filter *140*.dll | ForEach-Object { "  $($_.Name)  $($_.Length) bytes" }

      - name: Zip bundle (portable)
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath chess-auto-prep-${{ github.ref_name }}-windows.zip

      # Inno Setup ships on the hosted Windows image; the choco line is a
      # fallback for when an image update drops it.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\chess-auto-prep-$version-windows-setup.exe" "chess-auto-prep-${{ github.ref_name }}-windows-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            chess-auto-prep-${{ github.ref_name }}-windows.zip
            chess-auto-prep-${{ github.ref_name }}-windows-setup.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            stockfish: stockfish-macos-arm64
            excluded: x86_64
          - arch: x86_64
            stockfish: stockfish-macos-x86_64
            excluded: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Cache Stockfish
        uses: actions/cache@v4
        with:
          path: assets/executables
          key: stockfish-${{ hashFiles('tools/assets.lock.json') }}-${{ matrix.stockfish }}

      - name: Fetch Stockfish (${{ matrix.arch }})
        run: |
          python3 tools/fetch_assets.py --only ${{ matrix.stockfish }}
          python3 tools/fetch_assets.py --check --only ${{ matrix.stockfish }}

      - name: Cache bughouse engine
        uses: actions/cache@v4
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/bughouse.lock.json') }}-${{ matrix.arch }}

      - name: Fetch bughouse engine (${{ matrix.arch }})
        run: |
          python3 tools/fetch_bughouse.py --only bughouse-macos-${{ matrix.arch }}
          python3 tools/fetch_bughouse.py --check --only bughouse-macos-${{ matrix.arch }}

      - name: Build macOS ${{ matrix.arch }} release
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
          FLUTTER_XCODE_EXCLUDED_ARCHS: ${{ matrix.excluded }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
        run: flutter build macos --release

      - name: Keep ${{ matrix.arch }} only
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          shopt -s nullglob
          apps=(build/macos/Build/Products/Release/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "expected one .app, found ${#apps[@]}"
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          APP="${apps[0]}"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          # Main binary may already be thin; FlutterMacOS / onnxruntime often
          # are still universal. Always ditto the whole bundle.
          echo "Thinning bundle to $ARCH"
          THIN="${APP%.app}-${ARCH}.app"
          rm -rf "$THIN"
          ditto --arch "$ARCH" "$APP" "$THIN"
          rm -rf "$APP"
          mv "$THIN" "$APP"
          echo "Main: $(lipo -info "$APP/Contents/MacOS/$EXEC")"
          find "$APP/Contents/Frameworks" \( -name FlutterMacOS -o -name 'libonnxruntime*' \) ! -type l -print0 \
            | while IFS= read -r -d '' f; do echo "$f: $(lipo -info "$f")"; done

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          # -y keeps Versions/Current symlinks as links. zip -r follows them and
          # stores Stockfish + Maia + FlutterMacOS three times (~400 MB zips).
          zip -ry ../../../../../chess-auto-prep-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip *.app
          ls -lh ../../../../../chess-auto-prep-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-build
          path: chess-auto-prep-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Download

            | System | File |
            |---|---|
            | Windows | `windows-setup.exe` — or `windows.zip`, portable |
            | Debian / Ubuntu / Mint | `linux-amd64.deb` |
            | Other Linux | `linux.flatpak` — or `linux.zip`, portable |
            | macOS | `macos-arm64` (M1–M4) · `macos-x86_64` (Intel) |

            None of these are code-signed, so your OS warns once: Windows **More info → Run anyway**, macOS right-click → **Open**.

            [Full install notes](https://github.com/Zinkelburger/Chess-Auto-Prep#installing-a-release)
