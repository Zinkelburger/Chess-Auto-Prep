name: Release

on:
  push:
    tags:
      - 'v*'

# Do not cancel a tagged release midway through uploading its downloads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Stockfish is gitignored and fetched per job (host/arch only) so git clones
# stay small. Each artifact still bundles that platform's engine via
# pubspec.yaml → assets/executables/. macOS is two downloads, not a universal
# binary: Apple Silicon and Intel each get a native Flutter build plus the
# matching Stockfish in the same stockfish-macos.gz slot.

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check candidate version and release tag
        id: version
        run: python3 scripts/release_version.py

  quality-gate:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  advisory:
    needs: prepare
    uses: ./.github/workflows/release-advisory.yml

  bughouse-gate:
    needs: prepare
    uses: ./.github/workflows/bughouse.yml

  # Build alongside tests so platform packaging errors appear in the same run.
  # The release job requires the behavioral/build gates, not advisory checks.
  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang libgtk-3-dev pkg-config git g++ make rpm

      - name: Cache Stockfish
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: assets/executables
          key: stockfish-${{ hashFiles('tools/assets.lock.json') }}-linux

      - name: Fetch Stockfish (Linux)
        run: |
          python3 tools/fetch_assets.py --only stockfish-linux
          python3 tools/fetch_assets.py --check --only stockfish-linux

      - name: Cache bughouse engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/assets.lock.json') }}-linux

      # --check is not belt-and-braces here: a *missing* asset directory is
      # only a warning to `flutter build`, so a failed fetch would otherwise
      # sail through and ship an installer whose Bughouse Lab is simply absent.
      - name: Fetch bughouse engine (Linux)
        run: |
          python3 tools/fetch_assets.py --only bughouse-linux
          python3 tools/fetch_assets.py --check --only bughouse-linux

      # A release must not ship an engine that cannot start. The audit reads
      # the binaries' imports and insists every one is either part of the OS
      # or shipped by us; the run loads the network and searches for real.
      - name: Verify the bughouse engine runs
        timeout-minutes: 10
        run: |
          python3 tools/test_bughouse_engine.py deps
          python3 tools/test_bughouse_engine.py run

      - name: Build Linux release
        run: flutter build linux --release -t lib/main.dart

      # `flutter build` treats a *missing* asset directory as a printed warning
      # and exits 0, so nothing before this point can tell a build that bundled
      # the engine from one that quietly did not. Looking inside the artifact is
      # the only thing that can, and this is the failure it exists for: a green
      # release whose Bughouse Lab is simply absent.
      - name: Verify the engine is in the built bundle
        run: |
          set -euo pipefail
          DIR=build/linux/x64/release/bundle/data/flutter_assets/assets/bughouse
          for f in hivemind-linux.gz libonnxruntime.so.1.gz hivemind.onnx.gz manifest.json; do
            test -s "$DIR/$f" || { echo "MISSING $DIR/$f"; ls -la "$DIR" || true; exit 1; }
          done
          ls -la "$DIR"

      - name: Zip bundle
        run: |
          cd build/linux/x64/release/bundle
          # Only portable bundles carry the updater ownership marker.
          printf '1\n' > .chess-auto-prep-portable
          zip -r ../../../../../chess-auto-prep-${{ needs.prepare.outputs.tag }}-linux.zip .
          rm .chess-auto-prep-portable

      - name: Build .deb
        run: |
          VERSION="${RELEASE_TAG#v}"
          packaging/deb/build_deb.sh "$VERSION" build/linux/x64/release/bundle .
          mv "chess-auto-prep-$VERSION-linux-amd64.deb" \
             "chess-auto-prep-${{ needs.prepare.outputs.tag }}-linux-amd64.deb"

      - name: Build .rpm
        run: packaging/rpm/build_rpm.sh "${{ needs.prepare.outputs.tag }}" build/linux/x64/release/bundle .

      - name: Build AppImage
        run: packaging/appimage/build_appimage.sh "${{ needs.prepare.outputs.tag }}" build/linux/x64/release/bundle .

      - name: Install flatpak-builder
        run: sudo apt-get install -y flatpak flatpak-builder

      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=flatpak-repo flatpak-build \
            packaging/flatpak/com.example.chess_auto_prep.yml
          flatpak build-bundle flatpak-repo \
            chess-auto-prep-${{ needs.prepare.outputs.tag }}-linux.flatpak com.example.chess_auto_prep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-build
          path: |
            chess-auto-prep-${{ needs.prepare.outputs.tag }}-linux.zip
            chess-auto-prep-${{ needs.prepare.outputs.tag }}-linux.flatpak
            chess-auto-prep-${{ needs.prepare.outputs.tag }}-linux-amd64.deb
            chess-auto-prep-${{ needs.prepare.outputs.tag }}-linux-x86_64.rpm
            chess-auto-prep-${{ needs.prepare.outputs.tag }}-linux-x86_64.AppImage

  build-windows:
    needs: prepare
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}

  # Each app is built on a Mac of its own architecture, so the build and its
  # packaged-app test run natively: no cross-compiling, no Rosetta. Runner
  # versions are pinned so an image upgrade is a commit, not a surprise.
  build-macos:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            stockfish: stockfish-macos-arm64
            excluded: x86_64
          - arch: x86_64
            runner: macos-26-intel
            stockfish: stockfish-macos-x86_64
            excluded: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache Stockfish
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: assets/executables
          key: stockfish-${{ hashFiles('tools/assets.lock.json') }}-${{ matrix.stockfish }}

      - name: Fetch Stockfish (${{ matrix.arch }})
        run: |
          python3 tools/fetch_assets.py --only ${{ matrix.stockfish }}
          python3 tools/fetch_assets.py --check --only ${{ matrix.stockfish }}

      - name: Cache bughouse engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/assets.lock.json') }}-${{ matrix.arch }}

      - name: Fetch bughouse engine (${{ matrix.arch }})
        run: |
          python3 tools/fetch_assets.py --only bughouse-macos-${{ matrix.arch }}
          python3 tools/fetch_assets.py --check --only bughouse-macos-${{ matrix.arch }}

      # A release must not ship an engine that cannot start. The audit reads
      # the binaries' imports and insists every one is either part of the OS
      # or shipped by us; the run loads the network and searches for real.
      - name: Verify the bughouse engine runs
        timeout-minutes: 10
        run: |
          python3 tools/test_bughouse_engine.py deps
          python3 tools/test_bughouse_engine.py run

      - name: Build macOS ${{ matrix.arch }} release
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
          FLUTTER_XCODE_EXCLUDED_ARCHS: ${{ matrix.excluded }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
        run: |
          set -o pipefail
          flutter build macos --release -t lib/main.dart 2>&1 | tee macos-build.log

      - name: Keep ${{ matrix.arch }} only
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          shopt -s nullglob
          apps=(build/macos/Build/Products/Release/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "expected one .app, found ${#apps[@]}"
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          APP="${apps[0]}"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          # Main binary may already be thin; FlutterMacOS / onnxruntime often
          # are still universal. Always ditto the whole bundle.
          echo "Thinning bundle to $ARCH"
          THIN="${APP%.app}-${ARCH}.app"
          rm -rf "$THIN"
          ditto --arch "$ARCH" "$APP" "$THIN"
          # Stockfish 19's Intel slice reads NNUE data from its arm64 slice
          # using offsets into the complete universal file. Thinning that
          # helper makes the Intel engine SIGBUS even though codesign passes.
          # Preserve its signed bytes; thin only the app and other frameworks.
          cp -p "$APP/Contents/Helpers/stockfish-macos" "$THIN/Contents/Helpers/stockfish-macos"
          lipo "$THIN/Contents/Helpers/stockfish-macos" -verify_arch x86_64 arm64
          rm -rf "$APP"
          mv "$THIN" "$APP"
          echo "Main: $(lipo -info "$APP/Contents/MacOS/$EXEC")"
          find "$APP/Contents/Frameworks" \( -name FlutterMacOS -o -name 'libonnxruntime*' \) ! -type l -print0 \
            | while IFS= read -r -d '' f; do echo "$f: $(lipo -info "$f")"; done

      # `flutter build` treats a *missing* asset directory as a printed warning
      # and exits 0, so nothing before this point can tell a build that bundled
      # the engine from one that quietly did not. Looking inside the artifact is
      # the only thing that can, and this is the failure it exists for: a green
      # release whose Bughouse Lab is simply absent.
      - name: Verify the engine is in the built app
        run: |
          set -euo pipefail
          APP=$(ls -d build/macos/Build/Products/Release/*.app)
          DIR="$APP/Contents/Frameworks/App.framework/Resources/flutter_assets/assets/bughouse"
          for f in hivemind-macos.gz libonnxruntime.dylib.gz hivemind.onnx.gz manifest.json; do
            test -s "$DIR/$f" || { echo "MISSING $DIR/$f"; ls -la "$DIR" || true; exit 1; }
          done
          ls -la "$DIR"

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          # -y keeps Versions/Current symlinks as links. zip -r follows them and
          # stores Stockfish + Maia + FlutterMacOS three times (~400 MB zips).
          zip -ry ../../../../../chess-auto-prep-${{ needs.prepare.outputs.tag }}-macos-${{ matrix.arch }}.zip *.app
          ls -lh ../../../../../chess-auto-prep-${{ needs.prepare.outputs.tag }}-macos-${{ matrix.arch }}.zip

      - name: Packaged v2 documents, Stockfish, Maia and login sockets
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app)
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          codesign --verify --deep --strict "$APP"
          python3 tools/test_desktop_bundle.py "$APP/Contents/MacOS/$EXEC" --report desktop-release.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: macos-desktop-release-report-${{ matrix.arch }}
          path: |
            desktop-release.json
            macos-build.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-${{ matrix.arch }}-build
          path: chess-auto-prep-${{ needs.prepare.outputs.tag }}-macos-${{ matrix.arch }}.zip

  release:
    needs: [prepare, quality-gate, bughouse-gate, build-linux, build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-build
          path: artifacts/linux-build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-build
          path: artifacts/windows-build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-build
          path: artifacts/macos-arm64-build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-x86_64-build
          path: artifacts/macos-x86_64-build

      - name: Verify all nine downloads and generate their checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release_assets.py "$RELEASE_TAG" artifacts build/release-assets

      - name: Record the validated release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo '## Release assets validated'
            echo
            echo "Version: $RELEASE_TAG"
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'All required platform builds and release gates passed; all nine downloads have checksums.'
            echo 'Formatting, agent-rule consistency and Windows/macOS crash recovery are advisory; see their separate jobs.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: build/release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
