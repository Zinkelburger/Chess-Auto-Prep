name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Stockfish is gitignored and fetched per job (host/arch only) so git clones
# stay small. Each artifact still bundles that platform's engine via
# pubspec.yaml → assets/executables/. macOS is two downloads, not a universal
# binary: Apple Silicon and Intel each get a native Flutter build plus the
# matching Stockfish in the same stockfish-macos.gz slot.

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  build-linux:
    needs: quality-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang libgtk-3-dev pkg-config git g++ make rpm \
            libsnappy-dev liblz4-dev libzstd-dev libbz2-dev \
            libboost-fiber-dev libboost-context-dev libtbb-dev libjemalloc-dev zlib1g-dev

      - name: Cache TerarkDB + cdbdirect build
        uses: actions/cache@v6
        id: cdbdirect-cache
        with:
          path: packages/cdbdirect_flutter_libs/.build/deps
          key: cdbdirect-terarkdb-v1-${{ hashFiles('packages/cdbdirect_flutter_libs/scripts/build_native.sh', 'packages/cdbdirect_flutter_libs/src/cdbdirect_capi.cpp') }}
          restore-keys: |
            cdbdirect-terarkdb-v1-

      - name: Build bundled libcdbdirect.so
        run: |
          ./packages/cdbdirect_flutter_libs/scripts/build_native.sh --target linux-x64
          test -f packages/cdbdirect_flutter_libs/native/linux-x64/libcdbdirect.so

      - name: Cache Stockfish
        uses: actions/cache@v6
        with:
          path: assets/executables
          key: stockfish-${{ hashFiles('tools/assets.lock.json') }}-linux

      - name: Fetch Stockfish (Linux)
        run: |
          python3 tools/fetch_assets.py --only stockfish-linux
          python3 tools/fetch_assets.py --check --only stockfish-linux

      - name: Cache bughouse engine
        uses: actions/cache@v6
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/bughouse.lock.json') }}-linux

      # --check is not belt-and-braces here: a *missing* asset directory is
      # only a warning to `flutter build`, so a failed fetch would otherwise
      # sail through and ship an installer whose Bughouse Lab is simply absent.
      - name: Fetch bughouse engine (Linux)
        run: |
          python3 tools/fetch_bughouse.py --only bughouse-linux
          python3 tools/fetch_bughouse.py --check --only bughouse-linux

      # A release must not ship an engine that cannot start. The audit reads
      # the binaries' imports and insists every one is either part of the OS
      # or shipped by us; the run loads the network and searches for real.
      - name: Verify the bughouse engine runs
        timeout-minutes: 10
        run: |
          python3 tools/test_bughouse_engine.py deps
          python3 tools/test_bughouse_engine.py run

      - name: Build Linux release
        run: flutter build linux --release

      # `flutter build` treats a *missing* asset directory as a printed warning
      # and exits 0, so nothing before this point can tell a build that bundled
      # the engine from one that quietly did not. Looking inside the artifact is
      # the only thing that can, and this is the failure it exists for: a green
      # release whose Bughouse Lab is simply absent.
      - name: Verify the engine is in the built bundle
        run: |
          set -euo pipefail
          DIR=build/linux/x64/release/bundle/data/flutter_assets/assets/bughouse
          for f in hivemind-linux.gz libonnxruntime.so.1.gz hivemind.onnx.gz manifest.json; do
            test -s "$DIR/$f" || { echo "MISSING $DIR/$f"; ls -la "$DIR" || true; exit 1; }
          done
          ls -la "$DIR"

      # libcdbdirect.so dynamically links libraries end users won't have
      # (boost_fiber, TBB, jemalloc, snappy, ...). It is linked with an
      # $ORIGIN rpath, so copying them next to it makes them resolve both in
      # the zip and inside the Flatpak.
      - name: Bundle libcdbdirect runtime dependencies
        run: |
          BUNDLE_LIB=build/linux/x64/release/bundle/lib
          test -f "$BUNDLE_LIB/libcdbdirect.so"
          for dep in $(ldd "$BUNDLE_LIB/libcdbdirect.so" | awk '$3 ~ /^\// {print $3}'); do
            case "$(basename "$dep")" in
              libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|ld-linux*) continue ;;
              libgcc_s*|libstdc++*|libgomp*|libatomic*) continue ;;
            esac
            cp -vn "$dep" "$BUNDLE_LIB/"
          done

      - name: Zip bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../chess-auto-prep-${{ github.ref_name }}-linux.zip .

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/deb/build_deb.sh "$VERSION" build/linux/x64/release/bundle .
          mv "chess-auto-prep-$VERSION-linux-amd64.deb" \
             "chess-auto-prep-${{ github.ref_name }}-linux-amd64.deb"

      - name: Build .rpm
        run: packaging/rpm/build_rpm.sh "${{ github.ref_name }}" build/linux/x64/release/bundle .

      - name: Install flatpak-builder
        run: sudo apt-get install -y flatpak flatpak-builder

      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=flatpak-repo flatpak-build \
            packaging/flatpak/com.example.chess_auto_prep.yml
          flatpak build-bundle flatpak-repo \
            chess-auto-prep-${{ github.ref_name }}-linux.flatpak com.example.chess_auto_prep

      - uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            chess-auto-prep-${{ github.ref_name }}-linux.zip
            chess-auto-prep-${{ github.ref_name }}-linux.flatpak
            chess-auto-prep-${{ github.ref_name }}-linux-amd64.deb
            chess-auto-prep-${{ github.ref_name }}-linux-x86_64.rpm

  build-windows:
    needs: quality-gate
    # The supported client floor is Windows 10. Do not silently move the build
    # to VS 2026/Server 2025 through windows-latest: v1.15.3 did exactly that,
    # then shipped runtime files that had never been exercised as a bundle.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch the pinned Microsoft VC++ prerequisite
        shell: pwsh
        run: |
          python tools/fetch_vc_redist.py
          python tools/fetch_vc_redist.py --check
          $redist = "packaging\windows\prerequisites\VC_redist.x64.exe"
          $signature = Get-AuthenticodeSignature $redist
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            Write-Host "VC++ prerequisite is not validly signed by Microsoft:"
            $signature | Format-List
            exit 1
          }
          Get-FileHash $redist -Algorithm SHA256
          $signature.SignerCertificate | Select-Object Subject, Thumbprint

      - name: Cache Stockfish
        uses: actions/cache@v6
        with:
          path: assets/executables
          key: stockfish-${{ hashFiles('tools/assets.lock.json') }}-windows

      - name: Fetch Stockfish (Windows)
        run: |
          python tools/fetch_assets.py --only stockfish-windows
          python tools/fetch_assets.py --check --only stockfish-windows

      - name: Cache bughouse engine
        uses: actions/cache@v6
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/bughouse.lock.json') }}-windows

      - name: Fetch bughouse engine (Windows)
        run: |
          python tools/fetch_bughouse.py --only bughouse-windows
          python tools/fetch_bughouse.py --check --only bughouse-windows

      # A release must not ship an engine that cannot start. The audit reads
      # the binaries' imports and insists every one is either part of the OS
      # or shipped by us; the run loads the network and searches for real.
      - name: Verify the bughouse engine runs
        timeout-minutes: 10
        run: |
          python tools/test_bughouse_engine.py deps
          python tools/test_bughouse_engine.py run

      - name: Build Windows release
        run: flutter build windows --release

      # `flutter build` treats a *missing* asset directory as a printed warning
      # and exits 0, so nothing before this point can tell a build that bundled
      # the engine from one that quietly did not. Looking inside the artifact is
      # the only thing that can, and this is the failure it exists for: a green
      # release whose Bughouse Lab is simply absent.
      - name: Verify the engine is in the built bundle
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release/data/flutter_assets/assets/bughouse"
          $missing = @()
          foreach ($f in @('hivemind-windows.exe.gz','onnxruntime.dll.gz','hivemind.onnx.gz','manifest.json')) {
            $p = Join-Path $dir $f
            if (-not (Test-Path $p) -or ((Get-Item $p).Length -eq 0)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Bundle is missing: $($missing -join ', ')"
            Get-ChildItem $dir -ErrorAction SilentlyContinue
            exit 1
          }
          Get-ChildItem $dir | ForEach-Object { "  $($_.Name)  $($_.Length) bytes" }

      # The four DLLs windows/CMakeLists.txt deploys app-locally. Asserted
      # rather than assumed for the same reason the asset fetches are: the app
      # imports these, so a bundle without them does not start at all, and
      # nothing earlier in this job would have said so. Whether CMake's redist
      # list carries MSVCP140_1.dll varies by toolchain, and onnxruntime.dll
      # needs it, so it is named here explicitly.
      #
      # The bughouse engine depends on this step twice over: it runs as its
      # own process out of the support directory, so BughouseBundle copies
      # these four on from here to sit beside it. A bundle without them leaves
      # the engine unable to start on any machine that has never installed the
      # redistributable — and unable to say why, because the Windows loader
      # stops it before it can print anything.
      - name: Verify the VC++ runtime is bundled
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          $redist = Get-Content tools\vc_redist.lock.json | ConvertFrom-Json
          $missing = @()
          foreach ($dll in @('MSVCP140.dll','MSVCP140_1.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')) {
            if (-not (Test-Path (Join-Path $bundle $dll))) { $missing += $dll }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Bundle is missing: $($missing -join ', ')"
            Get-ChildItem $bundle -Filter *.dll | Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host "VC++ runtime bundled:"
          Get-ChildItem $bundle -Filter *140*.dll | ForEach-Object { "  $($_.Name)  $($_.Length) bytes" }

          # The installer omits these loose files and uses the pinned central
          # redistributable. Never let a newer compiler silently create an app
          # that requires exports the pinned prerequisite does not provide.
          $builtRuntime = (Get-Item (Join-Path $bundle 'MSVCP140.dll')).VersionInfo.FileVersionRaw
          $prerequisite = [version]$redist.version
          if ($builtRuntime -gt $prerequisite) {
            Write-Host "Built runtime $builtRuntime is newer than pinned prerequisite $prerequisite."
            Write-Host "Update tools/vc_redist.lock.json to a supported Microsoft release."
            exit 1
          }

      # The earlier live check runs before Flutter builds and therefore sees
      # the hosted runner's centrally installed runtime. Re-run with the exact
      # DLLs from the final app bundle beside Hivemind: that is what the
      # portable zip installs and what v1.15.3 accidentally left untested.
      - name: Verify Hivemind with the final portable runtime
        timeout-minutes: 10
        run: >-
          python tools/test_bughouse_engine.py run
          --install-to "final engine under test"
          --windows-runtime-from build/windows/x64/runner/Release

      - name: Zip bundle (portable)
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath chess-auto-prep-${{ github.ref_name }}-windows.zip

      # Inno Setup ships on the hosted Windows image; the choco line is a
      # fallback for when an image update drops it.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $version = "${{ github.ref_name }}".TrimStart("v")
          $redist = Get-Content tools\vc_redist.lock.json | ConvertFrom-Json
          & $iscc "/DAppVersion=$version" `
            "/DVCRedistVersion=$($redist.version)" `
            "/DVCRedistMajor=$($redist.major)" `
            "/DVCRedistMinor=$($redist.minor)" `
            "/DVCRedistBuild=$($redist.build)" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Compile-time exclusions are easy to get subtly wrong. Install the
          # finished setup silently on the runner and prove the installed app
          # uses the central runtime while the separate zip keeps its fallback.
          $setup = "dist\chess-auto-prep-$version-windows-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Chess Auto Prep installer test"
          New-Item -ItemType Directory -Force $installDir | Out-Null
          # Simulate an upgrade from the installer that shipped app-local DLLs.
          Get-ChildItem build/windows/x64/runner/Release -File | Where-Object {
            $_.Name -match '^(concrt140|msvcp140|vcruntime140).*\.dll$'
          } | Copy-Item -Destination $installDir
          if (-not (Test-Path (Join-Path $installDir 'msvcp140.dll'))) {
            throw 'Upgrade fixture did not contain the old runtime'
          }
          # Start-Process -Wait, not `& $setup`: setup.exe is a GUI-subsystem
          # binary, so PowerShell's call operator returns the moment it is
          # launched and leaves $LASTEXITCODE stale. The check below then ran
          # against a directory the installer had not touched yet — which read
          # as a pass for as long as that directory started out empty.
          $log = Join-Path $env:RUNNER_TEMP "installer.log"
          # $installDir has spaces in it, and -ArgumentList joins the array
          # without quoting anything, so the quotes have to be in the strings.
          $proc = Start-Process -FilePath (Resolve-Path $setup) -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            ('/DIR="{0}"' -f $installDir), ('/LOG="{0}"' -f $log)
          )
          if ($proc.ExitCode -ne 0) {
            Write-Host "Installer exited with $($proc.ExitCode):"
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            exit $proc.ExitCode
          }
          $looseRuntime = Get-ChildItem $installDir -File | Where-Object {
            $_.Name -match '^(concrt140|msvcp140|vcruntime140).*\.dll$'
          }
          if ($looseRuntime) {
            Write-Host "Installer unexpectedly deployed loose VC++ DLLs:"
            $looseRuntime | Select-Object -ExpandProperty Name
            if (Test-Path $log) { Write-Host "--- installer log ---"; Get-Content $log -Tail 80 }
            exit 1
          }
          Move-Item "dist\chess-auto-prep-$version-windows-setup.exe" "chess-auto-prep-${{ github.ref_name }}-windows-setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            chess-auto-prep-${{ github.ref_name }}-windows.zip
            chess-auto-prep-${{ github.ref_name }}-windows-setup.exe

  build-macos:
    needs: quality-gate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            stockfish: stockfish-macos-arm64
            excluded: x86_64
          - arch: x86_64
            stockfish: stockfish-macos-x86_64
            excluded: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Cache Stockfish
        uses: actions/cache@v6
        with:
          path: assets/executables
          key: stockfish-${{ hashFiles('tools/assets.lock.json') }}-${{ matrix.stockfish }}

      - name: Fetch Stockfish (${{ matrix.arch }})
        run: |
          python3 tools/fetch_assets.py --only ${{ matrix.stockfish }}
          python3 tools/fetch_assets.py --check --only ${{ matrix.stockfish }}

      - name: Cache bughouse engine
        uses: actions/cache@v6
        with:
          path: assets/bughouse
          key: bughouse-${{ hashFiles('tools/bughouse.lock.json') }}-${{ matrix.arch }}

      - name: Fetch bughouse engine (${{ matrix.arch }})
        run: |
          python3 tools/fetch_bughouse.py --only bughouse-macos-${{ matrix.arch }}
          python3 tools/fetch_bughouse.py --check --only bughouse-macos-${{ matrix.arch }}

      # A release must not ship an engine that cannot start. The audit reads
      # the binaries' imports and insists every one is either part of the OS
      # or shipped by us; the run loads the network and searches for real.
      - name: Verify the bughouse engine runs
        timeout-minutes: 10
        run: |
          python3 tools/test_bughouse_engine.py deps
          python3 tools/test_bughouse_engine.py run

      - name: Build macOS ${{ matrix.arch }} release
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
          FLUTTER_XCODE_EXCLUDED_ARCHS: ${{ matrix.excluded }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
        run: flutter build macos --release

      - name: Keep ${{ matrix.arch }} only
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          shopt -s nullglob
          apps=(build/macos/Build/Products/Release/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "expected one .app, found ${#apps[@]}"
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          APP="${apps[0]}"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          # Main binary may already be thin; FlutterMacOS / onnxruntime often
          # are still universal. Always ditto the whole bundle.
          echo "Thinning bundle to $ARCH"
          THIN="${APP%.app}-${ARCH}.app"
          rm -rf "$THIN"
          ditto --arch "$ARCH" "$APP" "$THIN"
          rm -rf "$APP"
          mv "$THIN" "$APP"
          echo "Main: $(lipo -info "$APP/Contents/MacOS/$EXEC")"
          find "$APP/Contents/Frameworks" \( -name FlutterMacOS -o -name 'libonnxruntime*' \) ! -type l -print0 \
            | while IFS= read -r -d '' f; do echo "$f: $(lipo -info "$f")"; done

      # `flutter build` treats a *missing* asset directory as a printed warning
      # and exits 0, so nothing before this point can tell a build that bundled
      # the engine from one that quietly did not. Looking inside the artifact is
      # the only thing that can, and this is the failure it exists for: a green
      # release whose Bughouse Lab is simply absent.
      - name: Verify the engine is in the built app
        run: |
          set -euo pipefail
          APP=$(ls -d build/macos/Build/Products/Release/*.app)
          DIR="$APP/Contents/Frameworks/App.framework/Resources/flutter_assets/assets/bughouse"
          for f in hivemind-macos.gz libonnxruntime.dylib.gz hivemind.onnx.gz manifest.json; do
            test -s "$DIR/$f" || { echo "MISSING $DIR/$f"; ls -la "$DIR" || true; exit 1; }
          done
          ls -la "$DIR"

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          # -y keeps Versions/Current symlinks as links. zip -r follows them and
          # stores Stockfish + Maia + FlutterMacOS three times (~400 MB zips).
          zip -ry ../../../../../chess-auto-prep-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip *.app
          ls -lh ../../../../../chess-auto-prep-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-build
          path: chess-auto-prep-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Download

            | System | File |
            |---|---|
            | Windows | `windows-setup.exe` — or `windows.zip`, portable |
            | Debian / Ubuntu / Mint | `linux-amd64.deb` |
            | Fedora / RHEL / openSUSE | `linux-x86_64.rpm` |
            | Other Linux | `linux.flatpak` — or `linux.zip`, portable |
            | macOS | `macos-arm64` (M1–M4) · `macos-x86_64` (Intel) |

            [Full install notes](https://github.com/Zinkelburger/Chess-Auto-Prep#installing-a-release)
