name: chess_auto_prep
description: Chess tactics trainer and PGN analyzer

publish_to: 'none'

version: 1.17.1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Chess functionality
  dartchess: ^0.13.1
  chessground: ^10.2.0
  multi_split_view: ^3.6.2
  meta: ^1.19.0

  # UI and state management
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  collection: ^1.19.1

  document_file_io:
    path: packages/document_file_io

  # File handling and HTTP
  file_picker: ^12.3.0
  http: ^1.1.2
  crypto: ^3.0.6  # SHA-256 for Lichess OAuth PKCE
  path_provider: ^2.1.6
  path_provider_linux: ^2.2.2
  flutter_svg: ^2.0.9
  csv: ^8.0.0
  share_plus: ^13.3.0

  shared_preferences: ^2.5.3
  shared_preferences_linux: ^2.4.1
  shared_preferences_windows: ^2.4.1
  shared_preferences_platform_interface: ^2.4.2
  stockfish: ^1.7.1
  onnxruntime: ^1.4.1
  ffi: ^2.1.0

  # Persistent eval cache (desktop: Linux / macOS / Windows).
  sqflite_common_ffi: ^2.4.2+1
  sqlite3: ^3.6.0
  # TWIC master-games download (zip per weekly issue).
  archive: ^4.2.0
  cdbdirect_flutter_libs:
    path: packages/cdbdirect_flutter_libs
  path: ^1.9.0
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  window_manager: ^0.5.2
  package_info_plus: ^10.2.1
  pub_semver: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  widgetbook: ^3.25.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/updater/
    - assets/images/
    - assets/pieces/
    - assets/maia3_simplified.onnx
    - assets/data/all_moves_maia3.json
    - assets/data/all_moves_maia3_reversed.json
    - assets/executables/
    - assets/bughouse/
    - assets/icons/
    - assets/licenses/
    - tools/assets.lock.json
    - assets/pgn_collections/
    - assets/data/openings/

  # Bundled so every desktop renders the same face: with no fonts here Flutter
  # falls back to whatever fontconfig (Linux) or the OS (Windows) provides.
  # Inter for UI text (drawn for screens at 12-14px, tabular figures);
  # Source Code Pro for moves, FENs and evals. Both SIL OFL, see
  # assets/fonts/LICENSE-*.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.ttf
        - asset: assets/fonts/SourceCodePro-It.ttf
          style: italic
        - asset: assets/fonts/SourceCodePro-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceCodePro-Bold.ttf
          weight: 700
    # The chess figurines (U+2654–U+265F) only: a pyftsubset cut of Noto Sans
    # Symbols 2, so ♘f3 draws the same on every OS instead of falling back to
    # whatever symbol font the machine has. OFL; see LICENSE-NotoSansSymbols2.
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Chess.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "knook.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "knook.png"
