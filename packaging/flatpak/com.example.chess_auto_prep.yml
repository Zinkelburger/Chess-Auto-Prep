# Flatpak manifest. Packages the already-built Flutter release bundle from
# build/linux/x64/release/bundle, so run `flutter build linux --release`
# (plus the CI dependency-bundling step for libcdbdirect) before building:
#
#   flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build \
#       packaging/flatpak/com.example.chess_auto_prep.yml
#   flatpak build-bundle flatpak-repo chess-auto-prep.flatpak com.example.chess_auto_prep
app-id: com.example.chess_auto_prep
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: chess_auto_prep
# freedesktop 24.08 dropped the `appstream-compose` binary, and only
# flatpak-builder >= 1.4 knows to call `appstreamcli compose` on the host
# instead. Release CI builds on ubuntu-22.04 — whose flatpak-builder is 1.2.x —
# because that is what sets the glibc floor for the app itself, so the build
# died in cleanup with "bwrap: execvp appstream-compose: No such file or
# directory" and no release was published at all. Skipping the compose step
# costs a sideloaded bundle nothing that matters: metainfo.xml, the .desktop
# entry and the hicolor icon are still installed and still exported, so the
# app installs on a double-click and lands in the menu with its icon.
appstream-compose: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Lichess/Chess.com game downloads and engine/network features.
  - --share=network
  # The app reads user-chosen paths (PGN imports, ChessDB data dirs) that it
  # persists and reopens across sessions, which document portals don't cover.
  # Also what lets a double-clicked .pgn under $HOME arrive as a plain path.
  - --filesystem=home
modules:
  - name: chess-auto-prep
    buildsystem: simple
    build-commands:
      - mkdir -p /app/chess-auto-prep /app/bin
      - cp -r bundle/* /app/chess-auto-prep/
      - ln -s /app/chess-auto-prep/chess_auto_prep /app/bin/chess_auto_prep
      - install -Dm644 com.example.chess_auto_prep.desktop
        /app/share/applications/com.example.chess_auto_prep.desktop
      - install -Dm644 com.example.chess_auto_prep.png
        /app/share/icons/hicolor/128x128/apps/com.example.chess_auto_prep.png
      - install -Dm644 com.example.chess_auto_prep.metainfo.xml
        /app/share/metainfo/com.example.chess_auto_prep.metainfo.xml
    sources:
      - type: dir
        path: ../../build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: ../../linux/com.example.chess_auto_prep.desktop
      - type: file
        path: ../../linux/com.example.chess_auto_prep.png
      - type: file
        path: com.example.chess_auto_prep.metainfo.xml
